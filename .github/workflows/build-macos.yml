name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos/source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: macos/source/go.mod
          cache-dependency-path: macos/source/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macos/source/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: macos/source/frontend
        run: npm ci

      - name: Build frontend
        working-directory: macos/source/frontend
        run: npm run build

      - name: Run OAuth status tests
        working-directory: macos/source/frontend
        run: npm run test:oauth

      - name: Run OAuth login UX tests
        working-directory: macos/source/frontend
        run: npm run test:oauth-ux

      - name: Run update-check tests
        working-directory: macos/source/frontend
        run: npm run test:update-check

      - name: Run Go race tests
        run: go test -race ./...

      - name: Build Universal App
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build -platform darwin/universal -trimpath -o "Antigravity WF助手"

      - name: Package macOS installer
        run: ./build/darwin/package-installer.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-WF-Assistant-macOS-universal
          path: |
            macos/source/build/bin/Antigravity-WF-Assistant-macOS-universal-v1.4.5-Installer.pkg
          if-no-files-found: error
