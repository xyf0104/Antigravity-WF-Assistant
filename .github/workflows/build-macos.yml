name: Build XIASS Tools Nextgen for macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nextgen-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: nextgen
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: nextgen
          key: nextgen-macos-universal

      - uses: actions/setup-go@v5
        with:
          go-version-file: nextgen/sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: |
            nextgen/sidecars/cockpit-cliproxy/go.sum
            macos/source/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextgen/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run release preflight and packaging unit tests
        run: |
          npm run release:preflight
          node --test scripts/release/*.test.cjs
          node scripts/check_brand_and_license.cjs

      - name: Build ad-hoc-signed Universal app and DMG
        run: npx tauri build --ci --config src-tauri/tauri.ci.conf.json --target universal-apple-darwin

      - name: Verify Universal sidecars and bundles
        shell: bash
        run: |
          set -euo pipefail
          for sidecar in \
            sidecars/cockpit-cliproxy/bin/xiass-cliproxy-universal-apple-darwin \
            sidecars/wf-bridge/bin/xiass-wf-bridge-universal-apple-darwin; do
            test -x "$sidecar"
            arches="$(lipo -archs "$sidecar")"
            [[ "$arches" == *x86_64* && "$arches" == *arm64* ]]
          done
          test "$(find target/universal-apple-darwin/release/bundle -type d -name '*.app' | wc -l | tr -d ' ')" -ge 1
          test "$(find target/universal-apple-darwin/release/bundle -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          app="$(find target/universal-apple-darwin/release/bundle -type d -name 'XIASS Tools.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Smoke-test packaged macOS app startup
        shell: bash
        run: |
          set -euo pipefail
          app="$(find target/universal-apple-darwin/release/bundle -type d -name 'XIASS Tools.app' -print -quit)"
          test -n "$app"
          bundle_executable="$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")"
          test -n "$bundle_executable"
          executable="$app/Contents/MacOS/$bundle_executable"
          test -x "$executable"
          smoke_root="$(mktemp -d)"
          cleanup() {
            if [[ -n "${app_pid:-}" ]] && kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
            rm -rf "$smoke_root"
          }
          trap cleanup EXIT
          XIASS_TOOLS_DATA_DIR="$smoke_root/data" "$executable" >"$smoke_root/stdout.log" 2>"$smoke_root/stderr.log" &
          app_pid=$!
          print_smoke_logs() {
            cat "$smoke_root/stderr.log" 2>/dev/null || true
            find "$smoke_root/data/logs" -type f -name 'app.log*' -exec cat {} + 2>/dev/null || true
          }
          frontend_ready=0
          for _ in {1..45}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              wait "$app_pid" || true
              print_smoke_logs
              echo "Packaged XIASS Tools exited before the frontend became ready" >&2
              exit 1
            fi
            if find "$smoke_root/data/logs" -type f -name 'app.log*' -exec grep -Fq '[Diagnostics] 前端启动超时' {} + 2>/dev/null; then
              print_smoke_logs
              echo "Packaged XIASS Tools reported a frontend startup timeout" >&2
              exit 1
            fi
            if find "$smoke_root/data/logs" -type f -name 'app.log*' -exec grep -Fq '[Diagnostics] 前端已就绪' {} + 2>/dev/null; then
              frontend_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$frontend_ready" -ne 1 ]]; then
            print_smoke_logs
            echo "Packaged XIASS Tools did not report frontend ready within 45 seconds" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: XIASS-Tools-Nextgen-macOS-universal
          path: nextgen/target/universal-apple-darwin/release/bundle
          if-no-files-found: error
          retention-days: 7
