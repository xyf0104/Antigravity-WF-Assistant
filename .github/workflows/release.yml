name: Publish XIASS Tools Nextgen Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nextgen-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    defaults:
      run:
        working-directory: nextgen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextgen/package-lock.json

      - name: Validate tag, version, changelog and updater credentials
        id: version
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == refs/tags/v* ]]
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME}" = "v${version}"
          release_commit="$(git rev-parse HEAD)"
          main_commit="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$main_commit"
          test "$release_commit" = "$main_commit"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          grep -Fq "## [${version}]" CHANGELOG.md
          grep -Fq "## [${version}]" CHANGELOG.zh-CN.md
          grep -Fq "当前正式版本为 v${version}" ../README.md
          node scripts/release/generate_tauri_release_config.cjs \
            --repo "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/tauri.release.preflight.json"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          extract_section() {
            awk -v version="$2" '
              /^## / {
                if (capture) exit
                if ($0 ~ ("^## \\[" version "\\]")) capture=1
              }
              capture { print }
            ' "$1"
          }
          {
            echo "## 更新日志"
            echo
            extract_section CHANGELOG.zh-CN.md "$version"
            echo
            echo "## Changelog"
            echo
            extract_section CHANGELOG.md "$version"
          } > release-notes.md
          test -s release-notes.md
          date -u +"%Y-%m-%dT%H:%M:%SZ" > published-at.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            nextgen/release-notes.md
            nextgen/published-at.txt
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: prepare
    runs-on: macos-14
    defaults:
      run:
        working-directory: nextgen
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: nextgen
          key: nextgen-release-macos-universal

      - uses: actions/setup-go@v5
        with:
          go-version-file: nextgen/sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: |
            nextgen/sidecars/cockpit-cliproxy/go.sum
            macos/source/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextgen/package-lock.json

      - run: npm ci

      - name: Run release preflight
        run: |
          npm run release:preflight
          node --test scripts/release/*.test.cjs
          node scripts/check_brand_and_license.cjs

      - name: Generate updater-enabled Tauri config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/release/generate_tauri_release_config.cjs --repo "$GITHUB_REPOSITORY"

      - name: Build signed-updater Universal app and DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci --config src-tauri/tauri.release.generated.conf.json --target universal-apple-darwin

      - name: Stage and verify macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          for sidecar in \
            sidecars/cockpit-cliproxy/bin/xiass-cliproxy-universal-apple-darwin \
            sidecars/wf-bridge/bin/xiass-wf-bridge-universal-apple-darwin; do
            test -x "$sidecar"
            arches="$(lipo -archs "$sidecar")"
            [[ "$arches" == *x86_64* && "$arches" == *arm64* ]]
          done
          node scripts/release/stage_release_assets.cjs \
            --platform macos \
            --mac-arch universal \
            --assets-dir target/universal-apple-darwin/release/bundle \
            --output-dir release-assets
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*_universal.app.tar.gz' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*_universal.app.tar.gz.sig' | wc -l | tr -d ' ')" -eq 1
          app="$(find target/universal-apple-darwin/release/bundle -type d -name 'XIASS Tools.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          bundle_executable="$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")"
          main_arches="$(lipo -archs "$app/Contents/MacOS/$bundle_executable")"
          [[ "$main_arches" == *x86_64* && "$main_arches" == *arm64* ]]
          for license in \
            CC-BY-NC-SA-4.0-LEGALCODE.txt \
            XIASS-Tools-MIT.txt \
            XIASS-Tools-Nextgen-CC-BY-NC-SA-4.0.txt \
            ORIGIN_AND_LICENSE.md \
            THIRD_PARTY_NOTICES.md \
            Tauri-APACHE-2.0.txt \
            Tauri-MIT.txt \
            jsQR-APACHE-2.0.txt \
            Lucide-ISC-and-MIT.txt \
            protobufjs-BSD-3-Clause.txt \
            React-MIT.txt \
            CLIProxyAPI-MIT.txt; do
            test -s "$app/Contents/Resources/licenses/$license"
          done

      - name: Smoke-test release DMG installation and app startup
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          dmg="$(find target/universal-apple-darwin/release/bundle -type f -name '*.dmg' -print -quit)"
          test -s "$dmg"
          mount_point="$smoke_root/mounted"
          install_root="$smoke_root/Applications"
          cocoa_home="$smoke_root/home"
          mkdir -p "$mount_point" "$install_root" "$cocoa_home"
          mounted=0
          app=''
          executable=''
          app_pid=''
          find_smoke_pids() {
            ps -ax -o pid=,command= | awk -v expected="$app/Contents/MacOS/" 'index($0, expected) { print $1 }'
          }
          find_smoke_main_pid() {
            # Consume the complete ps stream. Exiting awk early causes ps to
            # receive SIGPIPE under `set -o pipefail`, which masks a healthy app.
            ps -ax -o pid=,command= | awk -v expected="$executable" 'index($0, expected) && !found { print $1; found = 1 }'
          }
          stop_smoke_app() {
            local pid
            for pid in $(find_smoke_pids); do
              kill "$pid" 2>/dev/null || true
            done
            for _ in {1..10}; do
              [[ -z "$(find_smoke_pids)" ]] && return
              sleep 1
            done
            for pid in $(find_smoke_pids); do
              kill -KILL "$pid" 2>/dev/null || true
            done
          }
          cleanup() {
            [[ -n "$app" ]] && stop_smoke_app
            if [[ "$mounted" -eq 1 ]]; then
              hdiutil detach "$mount_point" -force >/dev/null 2>&1 || true
            fi
            rm -rf "$smoke_root"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          mounted=1
          source_app="$(find "$mount_point" -maxdepth 2 -type d -name 'XIASS Tools.app' -print -quit)"
          test -n "$source_app"
          ditto "$source_app" "$install_root/XIASS Tools.app"
          app="$install_root/XIASS Tools.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          bundle_executable="$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")"
          test -n "$bundle_executable"
          executable="$app/Contents/MacOS/$bundle_executable"
          test -x "$executable"
          # Tauri may preserve a sidecar's plain filename in a Universal bundle
          # or append a target suffix. Accept both forms, then verify its arches.
          for sidecar_pattern in 'xiass-wf-bridge*' 'xiass-cliproxy*'; do
            installed_sidecar="$(find "$app/Contents" -type f -name "$sidecar_pattern" -print -quit)"
            test -x "$installed_sidecar"
            installed_arches="$(lipo -archs "$installed_sidecar")"
            [[ "$installed_arches" == *x86_64* && "$installed_arches" == *arm64* ]]
          done
          installed_wf_bridge="$(find "$app/Contents" -type f -name 'xiass-wf-bridge*' -print -quit)"
          test -x "$installed_wf_bridge"
          node scripts/release/smoke_wf_bridge_sidecar.mjs \
            --binary "$installed_wf_bridge" \
            --platform macos
          print_smoke_logs() {
            cat "$smoke_root/stderr.log" 2>/dev/null || true
            find "$smoke_root/data/logs" -type f -name 'app.log*' -exec cat {} + 2>/dev/null || true
          }
          open -n -g -F \
            --env "RUST_LOG=info" \
            --env "CFFIXED_USER_HOME=$cocoa_home" \
            --env "XIASS_TOOLS_DATA_DIR=$smoke_root/data" \
            --env "XIASS_TOOLS_PACKAGE_SMOKE=1" \
            --stdout "$smoke_root/stdout.log" \
            --stderr "$smoke_root/stderr.log" \
            "$app"
          for _ in {1..15}; do
            app_pid="$(find_smoke_main_pid)"
            [[ -n "$app_pid" ]] && break
            sleep 1
          done
          if [[ -z "$app_pid" ]]; then
            print_smoke_logs
            echo "Release XIASS Tools did not start through LaunchServices" >&2
            exit 1
          fi
          frontend_ready=0
          for _ in {1..45}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              wait "$app_pid" || true
              print_smoke_logs
              echo "Release XIASS Tools exited before the frontend became ready" >&2
              exit 1
            fi
            if find "$smoke_root/data/logs" -type f -name 'app.log*' -exec grep -Fq '[Diagnostics] 前端启动超时' {} + 2>/dev/null; then
              print_smoke_logs
              echo "Release XIASS Tools reported a frontend startup timeout" >&2
              exit 1
            fi
            if find "$smoke_root/data/logs" -type f -name 'app.log*' -exec grep -Fq '[Diagnostics] 前端已就绪' {} + 2>/dev/null; then
              frontend_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$frontend_ready" -ne 1 ]]; then
            print_smoke_logs
            echo "Release XIASS Tools did not report frontend ready within 45 seconds" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: nextgen/release-assets
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: prepare
    # WiX 3.14's linker is not reliable on the current Windows Server 2025 image.
    # Pin the release lane to the supported Windows Server 2022 toolchain.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: nextgen
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: nextgen
          key: nextgen-release-windows-x64

      - uses: actions/setup-go@v5
        with:
          go-version-file: nextgen/sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: |
            nextgen/sidecars/cockpit-cliproxy/go.sum
            windows/source/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextgen/package-lock.json

      - run: npm ci

      - name: Run release preflight
        shell: pwsh
        run: |
          npm run release:preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/release/*.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check_brand_and_license.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate updater-enabled Tauri config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/release/generate_tauri_release_config.cjs --repo "$env:GITHUB_REPOSITORY"

      - name: Prepare verified WiX linker for hosted runner validation
        shell: pwsh
        run: ./scripts/ci/prepare-wix-light-wrapper.ps1

      - name: Build signed-updater Windows x64 installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci --config src-tauri/tauri.release.generated.conf.json --target x86_64-pc-windows-msvc

      - name: Stage and verify Windows release assets
        shell: pwsh
        run: |
          $sidecars = @(
            'sidecars/cockpit-cliproxy/bin/xiass-cliproxy-x86_64-pc-windows-msvc.exe',
            'sidecars/wf-bridge/bin/xiass-wf-bridge-x86_64-pc-windows-msvc.exe'
          )
          foreach ($sidecar in $sidecars) {
            if (-not (Test-Path $sidecar -PathType Leaf)) { throw "Missing sidecar: $sidecar" }
            if ((Get-Item $sidecar).Length -le 0) { throw "Empty sidecar: $sidecar" }
          }
          node scripts/release/stage_release_assets.cjs --platform windows --assets-dir target/x86_64-pc-windows-msvc/release/bundle --output-dir release-assets
          $msi = @(Get-ChildItem release-assets -Filter '*.msi')
          $msiSig = @(Get-ChildItem release-assets -Filter '*.msi.sig')
          $nsis = @(Get-ChildItem release-assets -Filter '*-setup.exe')
          $nsisSig = @(Get-ChildItem release-assets -Filter '*-setup.exe.sig')
          if ($msi.Count -ne 1 -or $msiSig.Count -ne 1) { throw 'MSI updater asset/signature set is incomplete' }
          if ($nsis.Count -ne 1 -or $nsisSig.Count -ne 1) { throw 'NSIS updater asset/signature set is incomplete' }
          $licenseNames = @(
            'CC-BY-NC-SA-4.0-LEGALCODE.txt',
            'XIASS-Tools-MIT.txt',
            'XIASS-Tools-Nextgen-CC-BY-NC-SA-4.0.txt',
            'ORIGIN_AND_LICENSE.md',
            'THIRD_PARTY_NOTICES.md',
            'Tauri-APACHE-2.0.txt',
            'Tauri-MIT.txt',
            'jsQR-APACHE-2.0.txt',
            'Lucide-ISC-and-MIT.txt',
            'protobufjs-BSD-3-Clause.txt',
            'React-MIT.txt',
            'CLIProxyAPI-MIT.txt'
          )
          $inspectionRoot = Join-Path $env:RUNNER_TEMP ("xiass-tools-release-inspection-" + [guid]::NewGuid().ToString('N'))
          $msiRoot = Join-Path $inspectionRoot 'msi'
          $nsisRoot = Join-Path $inspectionRoot 'nsis'
          New-Item -ItemType Directory -Path $msiRoot, $nsisRoot | Out-Null
          try {
            $msiExtract = Start-Process -FilePath msiexec.exe -ArgumentList @('/a', $msi[0].FullName, '/qn', "TARGETDIR=$msiRoot") -Wait -PassThru
            if ($msiExtract.ExitCode -ne 0) { throw "MSI administrative extraction failed with code $($msiExtract.ExitCode)" }
            $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
            & $sevenZip x -y "-o$nsisRoot" $nsis[0].FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "NSIS extraction failed with code $LASTEXITCODE" }
            foreach ($packageRoot in @($msiRoot, $nsisRoot)) {
              foreach ($licenseName in $licenseNames) {
                $matches = @(Get-ChildItem $packageRoot -Recurse -File -Filter $licenseName -ErrorAction SilentlyContinue)
                if ($matches.Count -ne 1 -or $matches[0].Length -le 0) {
                  throw "Packaged license resource missing or empty: package=$packageRoot file=$licenseName"
                }
              }
            }
          }
          finally {
            Remove-Item -LiteralPath $inspectionRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke-test release Windows app startup
        shell: pwsh
        run: |
          $app = Get-ChildItem target\x86_64-pc-windows-msvc\release -Filter 'xiass-tools.exe' -File | Select-Object -First 1
          if (-not $app) { throw 'Packaged XIASS Tools executable was not found' }
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("xiass-tools-release-smoke-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          $previousDataDir = $env:XIASS_TOOLS_DATA_DIR
          $process = $null
          try {
            $env:XIASS_TOOLS_DATA_DIR = Join-Path $smokeRoot 'data'
            $stdoutPath = Join-Path $smokeRoot 'stdout.log'
            $stderrPath = Join-Path $smokeRoot 'stderr.log'
            $process = Start-Process -FilePath $app.FullName -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            $frontendReady = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              $process.Refresh()
              $appLog = if (Test-Path (Join-Path $smokeRoot 'data\logs')) {
                ((Get-ChildItem (Join-Path $smokeRoot 'data\logs') -Filter 'app.log*' -File -ErrorAction SilentlyContinue | ForEach-Object {
                  Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
                }) -join "`n")
              } else { '' }
              if ($process.HasExited) {
                Get-Content $stderrPath -ErrorAction SilentlyContinue | Write-Host
                $appLog | Write-Host
                throw "Release XIASS Tools exited before the frontend became ready with code $($process.ExitCode)"
              }
              if ($appLog.Contains('[Diagnostics] 前端启动超时')) {
                Get-Content $stderrPath -ErrorAction SilentlyContinue | Write-Host
                $appLog | Write-Host
                throw 'Release XIASS Tools reported a frontend startup timeout'
              }
              if ($appLog.Contains('[Diagnostics] 前端已就绪')) {
                $frontendReady = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $frontendReady) {
              Get-Content $stderrPath -ErrorAction SilentlyContinue | Write-Host
              $appLog | Write-Host
              throw 'Release XIASS Tools did not report frontend ready within 45 seconds'
            }
          }
          finally {
            $env:XIASS_TOOLS_DATA_DIR = $previousDataDir
            if ($process -and -not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
              $process.WaitForExit()
            }
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke-test release MSI and Setup installation lifecycle
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("xiass-tools-release-installer-smoke-" + [guid]::NewGuid().ToString('N'))
          try {
            & ../.github/scripts/smoke-windows-installers.ps1 `
              -BundleRoot target/x86_64-pc-windows-msvc/release/bundle `
              -SmokeRoot $smokeRoot `
              -BridgeSmokeScript (Resolve-Path 'scripts/release/smoke_wf_bridge_sidecar.mjs').Path
          }
          finally {
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: nextgen/release-assets
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextgen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install updater signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign

      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: nextgen/release-metadata

      - uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: nextgen/release-assets

      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: nextgen/release-assets

      - name: Build and validate updater manifests before publication
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          notes="release-metadata/release-notes.md"
          published_at="$(cat release-metadata/published-at.txt)"
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.msi' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*-setup.exe' | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*_universal.app.tar.gz' | wc -l | tr -d ' ')" -eq 1
          signature_work="$(mktemp -d)"
          trap 'rm -rf "$signature_work"' EXIT
          printf '%s' "$TAURI_UPDATER_PUBLIC_KEY" | base64 --decode > "$signature_work/updater.pub"
          mapfile -d '' updater_signatures < <(find release-assets -maxdepth 1 -type f -name '*.sig' -print0 | sort -z)
          test "${#updater_signatures[@]}" -eq 3
          for updater_signature in "${updater_signatures[@]}"; do
            updater_payload="${updater_signature%.sig}"
            decoded_signature="$signature_work/$(basename "$updater_signature").minisig"
            test -s "$updater_payload"
            base64 --decode "$updater_signature" > "$decoded_signature"
            minisign -V -m "$updater_payload" -x "$decoded_signature" -p "$signature_work/updater.pub"
          done
          node scripts/release/build_target_latest_json.cjs \
            --version "$version" \
            --repo "$GITHUB_REPOSITORY" \
            --assets-dir release-assets \
            --notes-file "$notes" \
            --published-at "$published_at" \
            --targets darwin-aarch64-app,darwin-x86_64-app,windows-x86_64-msi,windows-x86_64-nsis \
            --output-dir target-manifests
          node scripts/release/build_merged_latest_json.cjs \
            --version "$version" \
            --repo "$GITHUB_REPOSITORY" \
            --assets-dir release-assets \
            --notes-file "$notes" \
            --published-at "$published_at" \
            --output latest.json
          cp target-manifests/*.json release-assets/
          cp latest.json release-assets/
          (
            cd release-assets
            node ../scripts/release/gen_checksums.cjs \
              --input . \
              --output SHA256SUMS.txt
          )
          test "$(wc -l < release-assets/SHA256SUMS.txt | tr -d ' ')" -eq 4
          mapfile -d '' release_files < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          test "${#release_files[@]}" -eq 13
          for release_file in "${release_files[@]}"; do
            release_name="$(basename "$release_file")"
            case "$release_name" in
              SHA256SUMS.txt|latest.json|latest-darwin-aarch64-app.json|latest-darwin-x86_64-app.json|latest-windows-x86_64-msi.json|latest-windows-x86_64-nsis.json) ;;
              *_universal.dmg|*_universal.app.tar.gz|*_universal.app.tar.gz.sig) ;;
              *_x64_en-US.msi|*_x64_en-US.msi.sig|*_x64-setup.exe|*_x64-setup.exe.sig) ;;
              *)
                echo "Release attachment is outside the whitelist: $release_name" >&2
                exit 1
                ;;
            esac
          done
          node --test scripts/release/*.test.cjs

      - name: Create draft, upload the complete verified set, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ needs.prepare.outputs.version }}"
          title="XIASS Tools ${tag}"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            test "$is_draft" = true
          else
            gh release create "$tag" --draft --title "$title" --notes-file release-metadata/release-notes.md
          fi
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -eq 13
          gh release upload "$tag" "${assets[@]}" --clobber
          local_names="$(mktemp)"
          remote_names="$(mktemp)"
          for asset in "${assets[@]}"; do basename "$asset"; done | sort > "$local_names"
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > "$remote_names"
          diff -u "$local_names" "$remote_names"
          gh release edit "$tag" --title "$title" --notes-file release-metadata/release-notes.md --draft=false --prerelease=false --latest

      - name: Verify published updater manifests and downloads
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/verify_published_updater_manifests.cjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --targets darwin-aarch64-app,darwin-x86_64-app,windows-x86_64-msi,windows-x86_64-nsis \
            --legacy true \
            --attempts 12 \
            --delay-ms 5000 \
            --timeout-ms 30000
