name: Build XIASS Tools Nextgen for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nextgen-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nextgen
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: nextgen
          key: nextgen-windows-x64

      - uses: actions/setup-go@v5
        with:
          go-version-file: nextgen/sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: |
            nextgen/sidecars/cockpit-cliproxy/go.sum
            windows/source/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextgen/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run release preflight and packaging unit tests
        shell: pwsh
        run: |
          npm run release:preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/release/*.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check_brand_and_license.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned Windows x64 installers
        run: npx tauri build --ci --config src-tauri/tauri.ci.conf.json --target x86_64-pc-windows-msvc

      - name: Verify Windows sidecars and installers
        shell: pwsh
        run: |
          $sidecars = @(
            'sidecars/cockpit-cliproxy/bin/xiass-cliproxy-x86_64-pc-windows-msvc.exe',
            'sidecars/wf-bridge/bin/xiass-wf-bridge-x86_64-pc-windows-msvc.exe'
          )
          foreach ($sidecar in $sidecars) {
            if (-not (Test-Path $sidecar -PathType Leaf)) { throw "Missing sidecar: $sidecar" }
            if ((Get-Item $sidecar).Length -le 0) { throw "Empty sidecar: $sidecar" }
          }
          $msi = @(Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle -Recurse -Filter '*.msi')
          $nsis = @(Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle -Recurse -Filter '*-setup.exe')
          if ($msi.Count -ne 1) { throw "Expected one MSI, found $($msi.Count)" }
          if ($nsis.Count -ne 1) { throw "Expected one NSIS installer, found $($nsis.Count)" }

      - uses: actions/upload-artifact@v4
        with:
          name: XIASS-Tools-Nextgen-Windows-x64
          path: nextgen/target/x86_64-pc-windows-msvc/release/bundle
          if-no-files-found: error
          retention-days: 7
