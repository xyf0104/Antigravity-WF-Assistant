name: Build XIASS Tools for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows/source/go.mod
          cache-dependency-path: windows/source/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/source/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: windows/source/frontend
        run: npm ci

      - name: Build frontend
        working-directory: windows/source/frontend
        run: npm run build

      - name: Run model grouping tests
        working-directory: windows/source/frontend
        run: node --test test/modelGroups.test.mjs

      - name: Run OAuth status tests
        working-directory: windows/source/frontend
        run: npm run test:oauth

      - name: Run OAuth login UX tests
        working-directory: windows/source/frontend
        run: npm run test:oauth-ux

      - name: Run patch progress UX tests
        working-directory: windows/source/frontend
        run: npm run test:patch-ux

      - name: Run update-check tests
        working-directory: windows/source/frontend
        run: npm run test:update-check

      - name: Run reasoning capability tests
        working-directory: windows/source/frontend
        run: node --test test/reasoningCapabilities.test.mjs

      - name: Run complete frontend regression suite
        working-directory: windows/source/frontend
        run: node --test test/*.test.mjs

      - name: Run Go race tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build Windows x64
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build -platform windows/amd64 -trimpath -o "XIASS Tools-v$version.exe"

      - name: Verify generated Wails bindings
        working-directory: windows/source/frontend
        run: node --test test/wailsBindings.verify.mjs

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        working-directory: windows/source/build/windows
        shell: pwsh
        run: |
          $version = (Get-Content ../../VERSION -Raw).Trim()
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 "/DAPP_VERSION=$version" installer.nsi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XIASS-Tools-Windows-x64
          path: |
            windows/source/build/bin/XIASS-Tools-Windows-x64-v*-Setup.exe
          if-no-files-found: error
