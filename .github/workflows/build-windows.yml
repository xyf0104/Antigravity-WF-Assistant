name: Build XIASS Tools Nextgen for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nextgen-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Keep CI on the same stable WiX toolchain as the signed release workflow.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: nextgen
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: nextgen
          key: nextgen-windows-x64

      - uses: actions/setup-go@v5
        with:
          go-version-file: nextgen/sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: |
            nextgen/sidecars/cockpit-cliproxy/go.sum
            windows/source/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextgen/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run release preflight and packaging unit tests
        shell: pwsh
        run: |
          npm run release:preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/release/*.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check_brand_and_license.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare verified WiX linker for hosted runner validation
        shell: pwsh
        run: ./scripts/ci/prepare-wix-light-wrapper.ps1

      - name: Build unsigned Windows x64 installers
        run: npx tauri build --ci --config src-tauri/tauri.ci.conf.json --target x86_64-pc-windows-msvc

      - name: Print WiX linker diagnostic after failed installer build
        if: failure()
        shell: pwsh
        run: |
          if ($env:XIASS_WIX_LIGHT_LOG -and (Test-Path $env:XIASS_WIX_LIGHT_LOG -PathType Leaf)) {
            Get-Content $env:XIASS_WIX_LIGHT_LOG -Raw | Write-Host
          }
          else {
            Write-Host 'WiX linker diagnostic log was not created.'
          }

      - name: Verify Windows sidecars and installers
        shell: pwsh
        run: |
          $sidecars = @(
            'sidecars/cockpit-cliproxy/bin/xiass-cliproxy-x86_64-pc-windows-msvc.exe',
            'sidecars/wf-bridge/bin/xiass-wf-bridge-x86_64-pc-windows-msvc.exe'
          )
          foreach ($sidecar in $sidecars) {
            if (-not (Test-Path $sidecar -PathType Leaf)) { throw "Missing sidecar: $sidecar" }
            if ((Get-Item $sidecar).Length -le 0) { throw "Empty sidecar: $sidecar" }
          }
          $msi = @(Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle -Recurse -Filter '*.msi')
          $nsis = @(Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle -Recurse -Filter '*-setup.exe')
          if ($msi.Count -ne 1) { throw "Expected one MSI, found $($msi.Count)" }
          if ($nsis.Count -ne 1) { throw "Expected one NSIS installer, found $($nsis.Count)" }
          if ($msi[0].Length -le 0) { throw "MSI is empty: $($msi[0].FullName)" }
          if ($nsis[0].Length -le 0) { throw "NSIS Setup is empty: $($nsis[0].FullName)" }
          # The lifecycle smoke below installs each package, validates every
          # required resource in the installed application, starts it, then
          # uninstalls it. Avoid a separate msiexec /a pass here: on hosted
          # runners that administrative extraction can wait indefinitely while
          # adding no coverage beyond the real install lifecycle.
          Write-Host 'Installer payload contents are verified by the clean installation lifecycle smoke test.'

      - name: Smoke-test packaged Windows app startup
        shell: pwsh
        run: |
          $app = Get-ChildItem target\x86_64-pc-windows-msvc\release -Filter 'xiass-tools.exe' -File | Select-Object -First 1
          if (-not $app) { throw 'Packaged XIASS Tools executable was not found' }
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("xiass-tools-smoke-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          $previousDataDir = $env:XIASS_TOOLS_DATA_DIR
          $process = $null
          try {
            $env:XIASS_TOOLS_DATA_DIR = Join-Path $smokeRoot 'data'
            $stdoutPath = Join-Path $smokeRoot 'stdout.log'
            $stderrPath = Join-Path $smokeRoot 'stderr.log'
            $process = Start-Process -FilePath $app.FullName -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            $frontendReady = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              $process.Refresh()
              $appLog = if (Test-Path (Join-Path $smokeRoot 'data\logs')) {
                ((Get-ChildItem (Join-Path $smokeRoot 'data\logs') -Filter 'app.log*' -File -ErrorAction SilentlyContinue | ForEach-Object {
                  Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
                }) -join "`n")
              } else { '' }
              if ($process.HasExited) {
                Get-Content $stderrPath -ErrorAction SilentlyContinue | Write-Host
                $appLog | Write-Host
                throw "Packaged XIASS Tools exited before the frontend became ready with code $($process.ExitCode)"
              }
              if ($appLog.Contains('[Diagnostics] 前端启动超时')) {
                Get-Content $stderrPath -ErrorAction SilentlyContinue | Write-Host
                $appLog | Write-Host
                throw 'Packaged XIASS Tools reported a frontend startup timeout'
              }
              if ($appLog.Contains('[Diagnostics] 前端已就绪')) {
                $frontendReady = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $frontendReady) {
              Get-Content $stderrPath -ErrorAction SilentlyContinue | Write-Host
              $appLog | Write-Host
              throw 'Packaged XIASS Tools did not report frontend ready within 45 seconds'
            }
          }
          finally {
            $env:XIASS_TOOLS_DATA_DIR = $previousDataDir
            if ($process -and -not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
              $process.WaitForExit()
            }
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke-test MSI and Setup installation lifecycle
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("xiass-tools-installer-smoke-" + [guid]::NewGuid().ToString('N'))
          try {
            & ../.github/scripts/smoke-windows-installers.ps1 `
              -BundleRoot target/x86_64-pc-windows-msvc/release/bundle `
              -SmokeRoot $smokeRoot `
              -BridgeSmokeScript (Resolve-Path 'scripts/release/smoke_wf_bridge_sidecar.mjs').Path
          }
          finally {
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: XIASS-Tools-Nextgen-Windows-x64
          path: nextgen/target/x86_64-pc-windows-msvc/release/bundle
          if-no-files-found: error
          retention-days: 7
